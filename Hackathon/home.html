<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAESTROMINDS | Home</title>
<style>
    * {
        box-sizing: border-box;
        font-family: 'Poppins', sans-serif;
    }

    body {
        margin: 0;
        background: linear-gradient(135deg, #f1eee6, #dad3c4);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
    }

    header {
        width: 100%;
        background-color: #3d3c39;
        color: white;
        padding: 15px 40px;
        display: flex;
        align-items: center;
        justify-content: flex-start;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    header img {
        width: 55px;
        height: 55px;
        border-radius: 10px;
        background: #fff;
        padding: 6px;
        margin-right: 15px;
    }

    header h1 {
        font-size: 22px;
        letter-spacing: 1px;
        font-weight: 600;
    }

    main {
        flex-grow: 1;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .button-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        width: 100%;
        max-width: 350px;
        padding: 30px;
    }

    .nav-btn {
        width: 100%;
        background-color: #3d3c39;
        color: white;
        border: none;
        border-radius: 15px;
        padding: 18px 0;
        font-size: 18px;
        font-weight: 500;
        letter-spacing: 0.5px;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
    }

    .nav-btn:hover {
        background-color: #b8b19e;
        color: #000;
        transform: translateY(-4px);
        box-shadow: 0 8px 20px rgba(0,0,0,0.25);
    }

    .sub-btns {
        display: none;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        margin-top: 10px;
        animation: fadeIn 0.4s ease forwards;
    }

    .sub-btns.show {
        display: flex;
    }

    .sub-btn {
        background-color: #b8b19e;
        color: #000;
        border: none;
        border-radius: 10px;
        padding: 12px 0;
        width: 85%;
        font-size: 16px;
        cursor: pointer;
        transition: all 0.3s ease;
    }

    .sub-btn:hover {
        background-color: #3d3c39;
        color: white;
        transform: translateY(-3px);
    }

    footer {
        text-align: center;
        padding: 15px;
        font-size: 13px;
        color: #3d3c39;
        background: rgba(255,255,255,0.6);
    }

    .back-arrow {
        position: absolute;
        left: 15px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        cursor: pointer;
        color: white;
        font-size: 26px;
        transition: transform 0.3s ease, color 0.3s ease;
    }

    .back-arrow:hover {
        color: #b8b19e;
        transform: translateY(-50%) scale(1.1);
    }


    header {
        position: relative;
    }

    header img {
        margin-left: 45px; /* creates space after the arrow */
    }


    @keyframes fadeIn {
        from {opacity: 0; transform: translateY(-10px);}
        to {opacity: 1; transform: translateY(0);}
    }

    @media (max-width: 600px) {
        header h1 {
            font-size: 18px;
        }
        .nav-btn {
            font-size: 16px;
            padding: 15px 0;
        }
    }
</style>
</head>
<body>

<header>
    <button class="back-arrow" onclick="goBack()">&#8592;</button>
    <img src="logo.jpg" alt="Maestrominds Logo">
    <h1>MAESTROMINDS ACCOUNTS PORTAL</h1>
</header>

<main>
    <div class="button-container">
        <button class="nav-btn" onclick="toggleSubmenu('quotation')">Quotation</button>
        <div id="quotation" class="sub-btns">
            <button class="sub-btn" onclick="navigate('quotation.html')">Quotation </button>
        </div>

        <button class="nav-btn" onclick="toggleSubmenu('invoice')">Invoice</button>
        <div id="invoice" class="sub-btns">
            <button class="sub-btn" onclick="navigate('tax_invoice.html')">Tax Invoice</button>
            <button class="sub-btn" onclick="navigate('proforma_invoice.html')">Proforma Invoice</button>
        </div>

        <button class="nav-btn" onclick="toggleSubmenu('note')">Note</button>
        <div id="note" class="sub-btns">
            <button class="sub-btn" onclick="navigate('credit_note.html')">Credit Note</button>
            <button class="sub-btn" onclick="navigate('debit_note.html')">Debit Note</button>
        </div>

        <button class="nav-btn" onclick="toggleSubmenu('voucher')">Voucher</button>
        <div id="voucher" class="sub-btns">
            <button class="sub-btn" onclick="navigate('receipt_voucher.html')">Receipt Voucher</button>
            <button class="sub-btn" onclick="navigate('payment_voucher.html')">Payment Voucher</button>
        </div>
    </div>
</main>

<footer>
    © 2025 MAESTROMINDS — All Rights Reserved
</footer>

<script>
function toggleSubmenu(id) {
    const all = document.querySelectorAll('.sub-btns');
    all.forEach(div => {
        if (div.id !== id) div.classList.remove('show');
    });
    document.getElementById(id).classList.toggle('show');
}

function navigate(page) {
    window.location.href = page;
}
function goBack() {
    window.location.href = "login.html"; // change to your actual login page filename
}
</script>

</body>
</html>
