<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAESTROMINDS | Sign Up</title>
<style>
    * {
        box-sizing: border-box;
        font-family: 'Poppins', sans-serif;
    }

    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #f1eee6, #dad3c4);
        overflow: hidden;
        position: relative;
    }

    .shape {
        position: absolute;
        border-radius: 50%;
        filter: blur(60px);
        opacity: 0.5;
        animation: float 8s infinite ease-in-out alternate;
    }

    .shape:nth-child(1) {
        width: 300px;
        height: 300px;
        background: #3d3c39;
        top: -50px;
        left: -80px;
        animation-delay: 0s;
    }

    .shape:nth-child(2) {
        width: 400px;
        height: 400px;
        background: #b8b19e;
        bottom: -80px;
        right: -100px;
        animation-delay: 2s;
    }

    @keyframes float {
        0% { transform: translateY(0px) translateX(0px); }
        100% { transform: translateY(25px) translateX(25px); }
    }

    .signup-container {
        display: flex;
        width: 900px;
        height: 560px;
        background: rgba(255, 255, 255, 0.75);
        border-radius: 25px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        overflow: hidden;
        backdrop-filter: blur(10px);
        z-index: 2;
        transition: transform 0.3s ease-in-out;
    }

    .signup-container:hover {
        transform: scale(1.01);
    }

    .left-panel {
        flex: 1;
        background-color: #3d3c39;
        color: #fff;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 40px;
    }

    .left-panel img {
        width: 90px;
        height: 90px;
        margin-bottom: 20px;
        border-radius: 15px;
        background: #f7f6f3;
        padding: 10px;
    }

    .left-panel h1 {
        font-size: 26px;
        letter-spacing: 1px;
        margin: 5px 0;
    }

    .left-panel p {
        font-style: italic;
        font-size: 14px;
        color: #d9d5cc;
    }

    .right-panel {
        flex: 1.3;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 50px;
        background-color: rgba(255, 255, 255, 0.9);
    }

    .right-panel h2 {
        margin-bottom: 25px;
        color: #3d3c39;
        font-size: 24px;
        text-align: center;
        letter-spacing: 0.5px;
    }

    .input-group {
        margin-bottom: 20px;
        position: relative;
    }

    .input-group label {
        display: block;
        font-weight: 500;
        font-size: 14px;
        color: #3d3c39;
        margin-bottom: 5px;
    }

    .input-group input {
        width: 100%;
        padding: 10px 40px 10px 14px;
        border: 1px solid #b7b1a3;
        border-radius: 10px;
        font-size: 14px;
        background-color: #faf8f3;
        transition: 0.2s ease-in-out;
    }

    .input-group input:focus {
        outline: none;
        border-color: #3d3c39;
        background: #fff;
    }

    .toggle-password {
        position: absolute;
        top: 34px;
        right: 12px;
        cursor: pointer;
        font-size: 16px;
        color: #6c6b68;
        user-select: none;
        transition: color 0.2s;
    }

    .toggle-password:hover {
        color: #000;
    }

    .signup-btn {
        width: 100%;
        background-color: #3d3c39;
        color: white;
        border: none;
        border-radius: 12px;
        padding: 12px;
        font-size: 16px;
        cursor: pointer;
        transition: 0.3s;
        margin-top: 10px;
    }

    .signup-btn:hover {
        background-color: #5a5955;
    }

    .extras {
        margin-top: 15px;
        text-align: center;
        font-size: 13px;
    }

    .extras a {
        color: #3d3c39;
        text-decoration: none;
        font-weight: 500;
    }

    .extras a:hover {
        text-decoration: underline;
    }

    @media (max-width: 768px) {
        .signup-container {
            flex-direction: column;
            height: auto;
            width: 90%;
        }
        .left-panel, .right-panel {
            flex: none;
            width: 100%;
        }
        .right-panel {
            padding: 30px;
        }
    }
</style>
</head>
<body>

<div class="shape"></div>
<div class="shape"></div>

<div class="signup-container">
    <div class="left-panel">
        <img src="c:\Users\Admin\Documents\Maetrominds intern\logo.jpg.jpg" alt="MAESTROMINDS Logo">
        <h1>MAESTROMINDS</h1>
        <p>Create Your Account</p>
    </div>

    <div class="right-panel">
        <h2>Sign Up</h2>

        <form id="signupForm">
            <div class="input-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="Enter your full name" required>
            </div>

            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter password" required>
                <span class="toggle-password" onclick="togglePassword('password', this)">👁</span>
            </div>

            <div class="input-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Re-enter password" required>
                <span class="toggle-password" onclick="togglePassword('confirmPassword', this)">👁</span>
            </div>

            <button type="submit" class="signup-btn">Create Account</button>

            <div class="extras">
                <p>Already have an account? <a href="login.html">Login</a></p>
            </div>
        </form>
    </div>
</div>

<script>
function togglePassword(id, icon) {
    const input = document.getElementById(id);
    if (input.type === "password") {
        input.type = "text";
        icon.textContent = "🙈";
    } else {
        input.type = "password";
        icon.textContent = "👁";
    }
}

document.getElementById("signupForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const pass = document.getElementById("password").value;
    const confirm = document.getElementById("confirmPassword").value;

    if (pass !== confirm) {
        alert("Passwords do not match!");
        return;
    }

    alert("Account created successfully!");
    window.location.href = "login.html";  // Redirect to login after sign-up
});
</script>

</body>
</html>
